name: GovAI Nexus Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  python-backend:
    name: Python 3.12 Backend Quality & Security Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit

      - name: Code Quality & PEP8 Linting
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Vulnerability Scan (Bandit AST)
        run: |
          bandit -r backend -ll -ii || true

      - name: Run Pytest Test Suites (Phases 3, 4, 5, 6)
        run: |
          pytest backend/tests -v --maxfail=1

  frontend-web:
    name: React 19 Frontend Quality & Bundle Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript Static Typecheck
        run: npm run lint

      - name: Production Bundle Compilation
        run: npm run build

  container-build:
    name: Multi-Container Docker Build Verification
    needs: [python-backend, frontend-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: false
          tags: govai-nexus-backend:latest

      - name: Build React Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          tags: govai-nexus-frontend:latest
